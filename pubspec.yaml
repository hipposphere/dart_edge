name: dart_edge_workspace
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

workspace:
  - packages/*
  - benchmarks/*/*
  - examples/*

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.2.2

dependency_overrides:
  cli_util: ^0.5.1
  # shadcn_jaspr 0.4.3 has not widened its Jaspr constraint past ^0.22.0 yet,
  # while this workspace already standardizes on Jaspr 0.23.x.
  jaspr: ^0.23.2



melos:
  scripts:
    analyze:
      run: dart analyze
      description: Run static analysis across the workspace.
    format:
      run: dart format .
      description: Format Dart sources across the workspace.
    test:
      run: dart run melos exec --concurrency=1 --dir-exists=test -- dart test
      description: Run tests in workspace packages that have a test directory.
    check:boundaries:
      run: dart --disable-dart-dev tool/check_package_boundaries.dart
      description: Check Dart package dependency and import boundaries.
    check:web:
      run: >-
        dart compile js
        tool/web_compile_smoke.dart
        -o /tmp/dart_edge_core_web_compile_smoke.js
      description: Check that dart_edge_core remains web-compilable.
    publish:dry-run:
      run: melos publish --no-private --dry-run --yes
      description: Validate publishable packages without uploading them.
