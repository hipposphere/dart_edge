name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packages without publishing.
        type: boolean
        default: true
      package_scope:
        description: Optional Melos package glob, for example dart_edge_http_server.
        required: false
        default: ""

permissions:
  contents: read

env:
  PUB_REGISTRY_URL: "https://registry.hippolabs.org/pub/internal-pub/"

jobs:
  publish:
    name: Publish to internal pub registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: dev

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze workspace
        run: dart analyze

      - name: Configure pub token
        env:
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "${PUB_TOKEN:-}" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "INTERNAL_PUB_TOKEN is not set; continuing dry run without configured pub credentials."
              exit 0
            fi

            echo "::error::Set the INTERNAL_PUB_TOKEN repository secret before publishing."
            exit 1
          fi

          dart pub token add "$PUB_REGISTRY_URL" --env-var PUB_TOKEN

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
        run: |
          args=(--no-private --dry-run --yes)

          if [[ -n "$PACKAGE_SCOPE" ]]; then
            args+=(--scope "$PACKAGE_SCOPE")
          fi

          dart run melos publish "${args[@]}"

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
        run: |
          args=(--no-private --no-dry-run --yes)

          if [[ -n "$PACKAGE_SCOPE" ]]; then
            args+=(--scope "$PACKAGE_SCOPE")
          fi

          dart run melos publish "${args[@]}"
