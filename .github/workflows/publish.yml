name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packages without publishing.
        type: boolean
        default: false
      package_scope:
        description: Optional Melos package glob, for example dart_edge_http_server.
        required: false
        default: ""

permissions:
  contents: read

env:
  PUB_REGISTRY_URL: "https://registry.hippolabs.org/pub/internal-pub/"

jobs:
  native_package_matrix:
    name: Resolve native package scope
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Resolve native packages
        id: packages
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
        shell: bash
        run: |
          set -euo pipefail
          native_packages=(
            dart_edge_audio
            dart_edge_auth
            dart_edge_bluetooth_server
            dart_edge_http_server_runtime
            dart_edge_openai_audio_client
            dart_edge_s3_client
            dart_edge_sip
            dart_edge_sql
            dart_edge_sql_pglite
            dart_edge_vad
            dart_edge_webtransport
          )

          selected_file="$RUNNER_TEMP/native-packages.jsonl"
          : > "$selected_file"

          for package in "${native_packages[@]}"; do
            if [[ -n "$PACKAGE_SCOPE" && "$package" != $PACKAGE_SCOPE ]]; then
              continue
            fi
            jq -cn --arg package "$package" '$package' >> "$selected_file"
          done

          packages="$(jq -cs '.' "$selected_file")"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  native_assets:
    name: Build native assets
    needs: native_package_matrix
    if: ${{ !inputs.dry_run && needs.native_package_matrix.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.native_package_matrix.outputs.packages) }}
    uses: ./.github/workflows/native-assets.yml
    permissions:
      contents: write
    with:
      package: ${{ matrix.package }}

  publish:
    name: Publish to internal pub registry
    needs:
      - native_package_matrix
      - native_assets
    if: ${{ always() && !cancelled() && (inputs.dry_run || needs.native_assets.result == 'success' || needs.native_assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: dev

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze workspace
        run: dart analyze

      - name: Configure pub token
        env:
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "${PUB_TOKEN:-}" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "INTERNAL_PUB_TOKEN is not set; continuing dry run without configured pub credentials."
              exit 0
            fi

            echo "::error::Set the INTERNAL_PUB_TOKEN repository secret before publishing."
            exit 1
          fi

          dart pub token add "$PUB_REGISTRY_URL" --env-var PUB_TOKEN

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
        run: |
          args=(--no-private --dry-run --yes)

          if [[ -n "$PACKAGE_SCOPE" ]]; then
            args+=(--scope "$PACKAGE_SCOPE")
          fi

          dart run melos publish "${args[@]}"

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGE_SCOPE: ${{ inputs.package_scope }}
          PUB_TOKEN: ${{ secrets.INTERNAL_PUB_TOKEN }}
        run: |
          args=(--no-private --no-dry-run --yes)

          if [[ -n "$PACKAGE_SCOPE" ]]; then
            args+=(--scope "$PACKAGE_SCOPE")
          fi

          dart run melos publish "${args[@]}"
