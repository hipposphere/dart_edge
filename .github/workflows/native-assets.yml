name: Native assets

on:
  workflow_call:
    inputs:
      package:
        description: Package to build native assets for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        description: Package to build native assets for
        required: true
        type: choice
        options:
          - dart_edge_audio
          - dart_edge_auth
          - dart_edge_bluetooth_server
          - dart_edge_http_server_runtime
          - dart_edge_s3_client
          - dart_edge_sip
          - dart_edge_sql
          - dart_edge_sql_pglite
          - dart_edge_vad

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve missing native assets
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
      targets: ${{ steps.plan.outputs.targets }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve missing artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package="${{ inputs.package }}"
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "packages/$package/rust/Cargo.toml")"
          toolchain="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "packages/$package/rust/rust-toolchain.toml")"
          tag="$package-native-v$version"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          targets_file="$RUNNER_TEMP/native-targets.jsonl"
          : > "$targets_file"

          add_target() {
            local os="$1"
            local arch="$2"
            local triple="$3"
            local runner="$4"
            local library
            case "$os" in
              linux) library="lib${package}.so" ;;
              macos) library="lib${package}.dylib" ;;
              *) echo "unsupported OS: $os" >&2; exit 1 ;;
            esac

            local artifact="${package}-${version}-${os}-${arch}-${library}"
            if grep -Fx "$artifact" <<<"$assets" >/dev/null && \
              grep -Fx "$artifact.sha256" <<<"$assets" >/dev/null; then
              echo "Skipping existing native artifact: $artifact"
              return
            fi

            jq -cn \
              --arg os "$os" \
              --arg arch "$arch" \
              --arg triple "$triple" \
              --arg runner "$runner" \
              --arg library "$library" \
              --arg name "$artifact" \
              --arg source ".dart_tool/native-assets/$package/$triple/release/$library" \
              '{os:$os, arch:$arch, triple:$triple, runner:$runner, library:$library, name:$name, source:$source}' \
              >> "$targets_file"
          }

          add_target linux x64 x86_64-unknown-linux-gnu ubuntu-latest
          add_target linux arm64 aarch64-unknown-linux-gnu ubuntu-24.04-arm
          add_target macos arm64 aarch64-apple-darwin macos-14

          targets="$(jq -cs '.' "$targets_file")"
          missing_count="$(jq 'length' <<<"$targets")"

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.missing_count != '0' }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ needs.prepare.outputs.toolchain }}" \
            --profile minimal \
            --target "${{ matrix.target.triple }}"

      - name: Install Linux native dependencies
        if: ${{ matrix.target.os == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update

          case "${{ needs.prepare.outputs.package }}" in
            dart_edge_bluetooth_server)
              sudo apt-get install -y pkg-config libdbus-1-dev
              ;;
            dart_edge_sip)
              sudo apt-get install -y pkg-config curl build-essential
              ;;
            *)
              sudo apt-get install -y pkg-config
              ;;
          esac

      - name: Prepare Linux PJSIP headers
        if: ${{ matrix.target.os == 'linux' && needs.prepare.outputs.package == 'dart_edge_sip' }}
        shell: bash
        run: |
          set -euo pipefail
          version="2.17"
          prefix="$RUNNER_TEMP/pjproject-headers"
          source="$RUNNER_TEMP/pjproject-$version"
          archive="$RUNNER_TEMP/pjproject-$version.tar.gz"
          include="$prefix/include"

          curl -fsSL \
            "https://github.com/pjsip/pjproject/archive/refs/tags/$version.tar.gz" \
            -o "$archive"
          mkdir -p "$source"
          tar -xzf "$archive" --strip-components=1 -C "$source"

          (
            cd "$source"
            ./configure \
              --prefix="$prefix" \
              --disable-sound \
              --disable-video \
              --disable-ffmpeg \
              --disable-v4l2 \
              --disable-libwebrtc
          )

          mkdir -p "$include"
          cp -R "$source/pjlib/include/." "$include/"
          cp -R "$source/pjlib-util/include/." "$include/"
          cp -R "$source/pjnath/include/." "$include/"
          cp -R "$source/pjmedia/include/." "$include/"
          cp -R "$source/pjsip/include/." "$include/"
          cp "$source/pjlib/include/pj/config_site_sample.h" \
            "$include/pj/config_site.h"

          mkdir -p "$prefix/lib/pkgconfig"
          cat > "$prefix/lib/pkgconfig/libpjproject.pc" <<EOF
          prefix=$prefix
          includedir=\${prefix}/include

          Name: libpjproject
          Description: PJSIP headers for unlinked dart_edge_sip native builds
          Version: $version
          Cflags: -DPJ_AUTOCONF=1 -I\${includedir}
          Libs:
          EOF

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          pkg-config --cflags libpjproject

      - name: Install macOS native dependencies
        if: ${{ matrix.target.os == 'macos' && needs.prepare.outputs.package == 'dart_edge_sip' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install pkg-config pjproject

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          package="${{ needs.prepare.outputs.package }}"
          triple="${{ matrix.target.triple }}"
          rustup run "${{ needs.prepare.outputs.toolchain }}" cargo build \
            --release \
            --manifest-path "packages/$package/rust/Cargo.toml" \
            --package "$package" \
            --target "$triple" \
            --target-dir ".dart_tool/native-assets/$package"

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${{ matrix.target.source }}" "artifacts/${{ matrix.target.name }}"
          shasum -a 256 "artifacts/${{ matrix.target.name }}" > "artifacts/${{ matrix.target.name }}.sha256"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.package }}-native-v${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.package }}-native-v${{ needs.prepare.outputs.version }}
          files: |
            artifacts/${{ matrix.target.name }}
            artifacts/${{ matrix.target.name }}.sha256
