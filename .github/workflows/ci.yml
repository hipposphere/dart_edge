name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: dev

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Resolve Dart workspace
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart workspace
        run: dart analyze

      - name: Check package boundaries
        run: dart --disable-dart-dev tool/check_package_boundaries.dart

      - name: Check dart_edge_core web compilation
        run: >-
          dart compile js
          tool/web_compile_smoke.dart
          -o /tmp/dart_edge_core_web_compile_smoke.js

      - name: Test Dart packages
        # Native-asset hooks share workspace locks, so package test processes
        # must not build those hooks concurrently.
        run: dart run melos exec --concurrency=1 --dir-exists=test -- dart test

      - name: Check shared Rust crates
        run: cargo check --workspace
