name: Publish Rust Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate crates without publishing.
        type: boolean
        default: true
      crate:
        description: Shared crate to publish.
        type: choice
        default: all
        options:
          - all
          - dart_edge_core
          - dart_edge_sql_core

permissions:
  contents: read

jobs:
  publish:
    name: Publish shared Rust crates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check shared Rust crates
        run: cargo check --workspace

      - name: Validate crate packages
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail

          package_crate() {
            cargo package --manifest-path "$1"
          }

          case "$CRATE" in
            all)
              package_crate crates/dart_edge_core/Cargo.toml
              package_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            dart_edge_core)
              package_crate crates/dart_edge_core/Cargo.toml
              ;;
            dart_edge_sql_core)
              package_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            *)
              echo "::error::Unsupported crate selection: $CRATE"
              exit 1
              ;;
          esac

      - name: Verify crates.io token
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::Set the CARGO_REGISTRY_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail

          publish_crate() {
            cargo publish --dry-run --manifest-path "$1"
          }

          case "$CRATE" in
            all)
              publish_crate crates/dart_edge_core/Cargo.toml
              publish_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            dart_edge_core)
              publish_crate crates/dart_edge_core/Cargo.toml
              ;;
            dart_edge_sql_core)
              publish_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            *)
              echo "::error::Unsupported crate selection: $CRATE"
              exit 1
              ;;
          esac

      - name: Publish crates
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail

          publish_crate() {
            cargo publish --manifest-path "$1"
          }

          case "$CRATE" in
            all)
              publish_crate crates/dart_edge_core/Cargo.toml
              publish_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            dart_edge_core)
              publish_crate crates/dart_edge_core/Cargo.toml
              ;;
            dart_edge_sql_core)
              publish_crate crates/dart_edge_sql_core/Cargo.toml
              ;;
            *)
              echo "::error::Unsupported crate selection: $CRATE"
              exit 1
              ;;
          esac
