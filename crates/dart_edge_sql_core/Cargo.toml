[package]
name = "dart_edge_sql_core"
version = "0.1.0"
edition = "2024"
description = "Shared SQL wire payload types for Dart Edge native crates."
license = "MIT"
repository = "https://github.com/flowhorn/dart_edge"
readme = "README.md"
keywords = ["dart-edge", "sql", "native-assets"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
