name: DartEdgeRuntimeNativeBindings
description: Generated C ABI bindings for dart_edge_runtime.
output: ../lib/src/native/generated_bindings.dart
headers:
  entry-points:
    - ../rust/include/dart_edge_runtime.h
functions:
  include:
    - dart_edge_runtime_.*
  leaf:
    include:
      - dart_edge_runtime_free_request
      - dart_edge_runtime_native_abi_version
structs:
  include:
    - NativeBytes
    - NativePair
    - NativeTransportRequest
typedefs:
  include:
    - dart_edge_runtime_request_ready_callback_t
exclude-all-by-default: true
sort: true
use-supported-typedefs: true
comments: false
preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names
ffi-native:
  asset-id: package:dart_edge_runtime/dart_edge_runtime.dart
