[package]
name = "dart_edge_bluetooth_server"
version = "0.1.4"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.23"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
