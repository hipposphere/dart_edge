[package]
name = "dart_edge_audio"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
dart_edge_core = "0.1.0"
hound = "3.5"
once_cell = "1.21"
rubato = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
