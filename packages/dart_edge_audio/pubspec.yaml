name: dart_edge_audio
description: Native-backed audio probing and conversion utilities for Dart Edge.
version: 0.3.13
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
repository: https://github.com/hipposphere/dart_edge/tree/main/packages/dart_edge_audio

environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  code_assets: ^1.2.1
  dart_edge_core:
    hosted: "https://registry.hippolabs.org/pub/internal-pub/"
    version: ^0.3.19
  dart_edge_native_assets:
    hosted: "https://registry.hippolabs.org/pub/internal-pub/"
    version: ^0.1.3
  dart_edge_native_bridge:
    hosted: "https://registry.hippolabs.org/pub/internal-pub/"
    version: ^0.1.4
  ffi: ^2.2.0
  hooks: ^2.0.2
  native_toolchain_rust: ^1.0.4+0

dev_dependencies:
  crypto: ^3.0.7
  dart_edge_vad: any
  ffigen: ^20.1.1
  test: ^1.30.0
