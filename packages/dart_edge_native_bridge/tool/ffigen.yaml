name: DartEdgeNativeBridgeBindings
description: Shared FFI value types for Dart Edge native packages.
output:
  bindings: ../lib/src/ffi/generated_bindings.dart
  symbol-file:
    output: package:dart_edge_native_bridge/src/ffi/generated_symbols.yaml
    import-path: package:dart_edge_native_bridge/dart_edge_native_bridge.dart
headers:
  entry-points:
    - ../../../crates/dart_edge_core/include/dart_edge_core_ffi.h
structs:
  include:
    - NativeBytes
    - NativeOwnedBytes
    - NativeString
    - NativePair
    - NativeResult
exclude-all-by-default: true
sort: true
use-supported-typedefs: true
comments: false
preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names
