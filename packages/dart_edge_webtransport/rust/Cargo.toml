[package]
name = "dart_edge_webtransport"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
once_cell = "1.21"
serde_json = "1"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
wtransport = { version = "0.7.1", features = ["dangerous-configuration"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
