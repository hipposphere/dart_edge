[package]
name = "dart_edge_webtransport"
version = "0.1.3"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
once_cell = "1.21"
serde_json = "1"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
# rcgen 0.14.x fails to compile with time 0.3.48 due to an upstream trait
# coherence conflict. Keep wtransport's transitive time dependency below it
# until rcgen/time publish a compatible release.
time = ">=0.3.21, <0.3.48"
wtransport = { version = "0.7.1", features = ["dangerous-configuration"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
