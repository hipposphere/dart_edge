[package]
name = "dart_edge_http_server_runtime"
version = "0.1.6"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = true, features = ["ws"] }
dart_edge_core = "0.1.0"
dart_edge_http_server_core = "0.1.0"
futures-util = "0.3"
http = "1.3"
jsonschema = { version = "0.46.0", default-features = false }
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
