images:
  app:
    type: flutter_app
    package: app
    flutter_version: 3.44.0
    web:
      wasm: true
      base_href_env: BASE_HREF
    nginx:
      env:
        required:
          - API_URL
        optional:
          BASE_HREF: /
      headers:
        Cross-Origin-Embedder-Policy: credentialless
        Cross-Origin-Opener-Policy: same-origin
    title: Example App
    description: Example Flutter web app
