[package]
name = "dart_edge_s3_client"
version = "0.1.17"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
aws-config = "=1.8.18"
aws-credential-types = "1"
aws-sdk-s3 = "=1.135.0"
# aws-smithy-types 1.5.0 triggers Rust 1.95 trait coherence and deferred
# signer inference failures in the AWS SDK stack. Stay on 1.4.x until the
# upstream smithy-rs/time interaction is fixed.
aws-smithy-types = { version = ">=1.4.9, <1.5.0", features = ["http-body-1-x"] }
aws-types = "1"
bytes = "1"
dart_edge_core = "0.2.0"
http-body = "1"
once_cell = "1.21"
# Keep transitive time resolution below the release that exposes the same
# upstream trait coherence conflict in AWS/rcgen dependency graphs.
time = ">=0.3.21, <0.3.48"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
