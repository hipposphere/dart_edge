[package]
name = "dart_edge_s3_client"
version = "0.1.6"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# aws-runtime 1.7.x fails to compile in its event-stream SigV4 signer with a
# generic type inference error. Keep the AWS SDK stack on the latest releases
# before that runtime line until AWS publishes a fixed aws-runtime release.
aws-config = "=1.8.13"
aws-credential-types = "1"
aws-sdk-s3 = "=1.122.0"
aws-types = "1"
dart_edge_core = "0.2.0"
once_cell = "1.21"
# aws-smithy-types 1.5.0 fails to compile with time 0.3.48 due to an
# upstream trait coherence conflict. Keep AWS SDK transitive time resolution
# below it until aws-smithy-types/time publish a compatible release.
time = ">=0.3.21, <0.3.48"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
