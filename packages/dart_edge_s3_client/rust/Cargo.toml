[package]
name = "dart_edge_s3_client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
dart_edge_core = "0.1.0"
once_cell = "1.21"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
