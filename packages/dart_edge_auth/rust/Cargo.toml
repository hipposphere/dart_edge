[package]
name = "dart_edge_auth"
version = "0.1.23"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
better-auth = { version = "0.10", features = ["sqlx-postgres"] }
better-auth-diesel-sqlite = { path = "vendor/better-auth-diesel-sqlite" }
chrono = { version = "0.4", features = ["serde"] }
dart_edge_core = "0.2.0"
dart_edge_http_server_core = "0.1.1"
dart_edge_sql_core = "0.1.0"
hmac = "0.12"
once_cell = "1.21"
scrypt = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# rcgen 0.14.x fails to compile with time 0.3.48 due to an upstream trait
# coherence conflict. Keep transitive TLS/certificate dependency resolution
# below it until rcgen/time publish a compatible release.
time = ">=0.3.21, <0.3.48"
tokio = { version = "1.52", features = ["rt", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
better-auth-api = { path = "vendor/better-auth-api" }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
