[package]
name = "dart_edge_auth"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
async-trait = "0.1"
better-auth = { version = "0.10", features = ["sqlx-postgres"] }
better-auth-diesel-sqlite = { path = "vendor/better-auth-diesel-sqlite" }
chrono = { version = "0.4", features = ["serde"] }
dart_edge_core = "0.1.0"
dart_edge_http_server_core = "0.1.0"
dart_edge_sql_core = "0.1.0"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
