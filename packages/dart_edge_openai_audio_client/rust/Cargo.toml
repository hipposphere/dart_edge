[package]
name = "dart_edge_openai_audio_client"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
dart_edge_core = "0.2.0"
once_cell = "1.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
